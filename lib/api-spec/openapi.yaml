openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for vonios remontas Klaipėdoje website
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Gallery projects
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all gallery projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /projects/{slug}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ProjectImage:
      type: object
      required: [url, alt]
      properties:
        url:
          type: string
        alt:
          type: string
        isBefore:
          type: ["boolean", "null"]
        isAfter:
          type: ["boolean", "null"]

    Project:
      type: object
      required: [slug, title, city, area, description, worksDone, mainImage, images]
      properties:
        slug:
          type: string
        title:
          type: string
        city:
          type: string
        area:
          type: string
        description:
          type: string
        worksDone:
          type: array
          items:
            type: string
        mainImage:
          $ref: "#/components/schemas/ProjectImage"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProjectImage"
        beforeImage:
          $ref: "#/components/schemas/ProjectImage"
          nullable: true
        afterImage:
          $ref: "#/components/schemas/ProjectImage"
          nullable: true
